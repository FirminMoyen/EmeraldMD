name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      # The Tauri crate embeds the built UI, so it must exist before cargo runs.
      - run: npm run build:web -w @emeraldmd/desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows minutes count double on private repos, and the current focus is
  # macOS + self-hosting (docs/milestone-macos-selfhost.md): run by hand.
  windows:
    name: Test and build (Windows)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:web -w @emeraldmd/desktop
      - run: cargo test --workspace
      - run: cargo build -p emeraldmd-desktop

  # macOS minutes count 10x on private repos; development happens on a Mac,
  # so this only runs when started by hand.
  macos:
    name: Test and build (macOS)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:web -w @emeraldmd/desktop
      - run: cargo test --workspace
      - run: cargo build -p emeraldmd-desktop
