[package]
name = "emeraldmd-desktop"
description = "EmeraldMD desktop and mobile app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "emeraldmd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.22"
dunce.workspace = true
emerald-core.workspace = true
emerald-sync = { workspace = true, features = ["http"] }
gethostname = "1.1"
# Server tokens: macOS Keychain, Windows Credential Manager, Secret Service on Linux.
keyring = "4.2"
notify.workspace = true
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["gzip", "deflate", "brotli"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-window-state = "2.5"
