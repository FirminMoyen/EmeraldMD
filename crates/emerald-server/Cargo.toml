[package]
name = "emerald-server"
description = "Self-hosted EmeraldMD server: serves vault folders over HTTP and WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emeraldmd-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8.9", features = ["ws"] }
emerald-core.workspace = true
emerald-sync.workspace = true
getrandom = "0.4"
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
emerald-sync = { workspace = true, features = ["http"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
tempfile.workspace = true
tokio-tungstenite = "0.30"
