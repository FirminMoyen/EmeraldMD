[package]
name = "emerald-sync"
description = "Offline-first vault sync for EmeraldMD: change detection, three-way planning and text merges"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# HttpRemote: sync against an emeraldmd-server over HTTP(S).
http = ["dep:reqwest", "dep:tungstenite"]

[dependencies]
diffy = "0.5"
emerald-core.workspace = true
reqwest = { version = "0.13", optional = true, features = ["blocking", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
# The server's event stream (WebSocket), with the system's root certificates.
tungstenite = { version = "0.29", optional = true, features = ["rustls-tls-native-roots"] }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
